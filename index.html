<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šablóna / Шпаргалка / Cheat sheet — CNC rezanie</title>
<meta name="description" content="Служебная шпаргалка по технологіях CNC-різання: плазма, лазер, воднострумінь, кисень, фрезерування.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#E9EDF1; --panel:#FFFFFF; --panel-2:#F3F6F9;
    --line:#C6D0DA; --line-soft:#DCE3EA;
    --ink:#131A21; --ink-2:#46545F; --ink-3:#6D7C88;
    --arc:#0A7C91; --arc-glow:#16A6BF;
    --copper:#A85F38; --hafnium:#7A5AA8;
    --heat:#C2661A; --steel:#8C9AA6; --steel-dark:#5E6D79;
    --water:#2C6BA8; --beam:#B03A6E; --mech:#5F7038;
    --ok:#2E7D52; --warn:#B5751A; --bad:#B33A3A;
    --shadow:0 1px 2px rgba(19,26,33,.06),0 8px 24px -12px rgba(19,26,33,.18);
    --f-disp:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
    --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E1319; --panel:#161D25; --panel-2:#1B242E;
      --line:#2C3945; --line-soft:#222D38;
      --ink:#DFE7EE; --ink-2:#A2B0BC; --ink-3:#76858F;
      --arc:#3FD2EC; --arc-glow:#8BEBFB;
      --copper:#D08A5E; --hafnium:#B49AE0;
      --heat:#E8913A; --steel:#7C8B98; --steel-dark:#4A5762;
      --water:#61A6E4; --beam:#EC7CAA; --mech:#A7BE6C;
      --ok:#55BE85; --warn:#E0A544; --bad:#E86A6A;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1319; --panel:#161D25; --panel-2:#1B242E;
    --line:#2C3945; --line-soft:#222D38;
    --ink:#DFE7EE; --ink-2:#A2B0BC; --ink-3:#76858F;
    --arc:#3FD2EC; --arc-glow:#8BEBFB;
    --copper:#D08A5E; --hafnium:#B49AE0;
    --heat:#E8913A; --steel:#7C8B98; --steel-dark:#4A5762;
    --water:#61A6E4; --beam:#EC7CAA; --mech:#A7BE6C;
    --ok:#55BE85; --warn:#E0A544; --bad:#E86A6A;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;}
  [hidden]{display:none!important;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);}
  .topbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:9px;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;}
  .brand .nm{font-family:var(--f-disp);font-weight:700;font-size:17px;}
  .brand .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}

  .langs{display:flex;gap:0;flex:0 0 auto;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .langs button{
    font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.07em;
    padding:6px 11px;border:0;border-right:1px solid var(--line);
    background:var(--panel);color:var(--ink-3);cursor:pointer;
  }
  .langs button:last-child{border-right:0;}
  .langs button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);font-weight:600;}
  .langs button:focus-visible{outline:2px solid var(--arc);outline-offset:-2px;}

  nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;font-family:var(--f-body);font-size:13.5px;font-weight:500;
    color:var(--ink-2);background:transparent;border:1px solid var(--line-soft);
    border-radius:2px;padding:7px 13px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  nav button:hover{color:var(--ink);border-color:var(--line);}
  nav button .bead{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  nav button[aria-selected="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--ink-3);font-weight:600;}
  nav button:focus-visible{outline:2px solid var(--arc);outline-offset:2px;}

  .wrap{max-width:1080px;margin:0 auto;padding:30px 16px 90px;}
  .panelview{display:flex;flex-direction:column;gap:38px;}
  .phead{display:flex;flex-direction:column;gap:9px;}
  .eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;}
  h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(29px,6vw,46px);line-height:1.05;margin:0;text-wrap:balance;}
  .lede{color:var(--ink-2);max-width:64ch;margin:0;font-size:16.5px;}
  section{display:flex;flex-direction:column;gap:15px;}
  h2{font-family:var(--f-disp);font-weight:600;font-size:23px;margin:0;text-wrap:balance;display:flex;align-items:baseline;gap:11px;}
  h2 .n{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.1em;}
  h3{font-family:var(--f-body);font-weight:600;font-size:15.5px;margin:0 0 3px;}
  p{margin:0;max-width:68ch;}
  p.note{color:var(--ink-2);font-size:14.5px;}
  ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:6px;}
  li{font-size:15px;color:var(--ink-2);}
  li b{color:var(--ink);}

  .fig{background:var(--panel);border:1px solid var(--line-soft);border-radius:3px;box-shadow:var(--shadow);padding:10px;overflow-x:auto;}
  .fig svg{display:block;width:100%;height:auto;min-width:520px;}
  figcaption{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);padding:9px 3px 1px;}
  svg text{font-family:var(--f-mono);}
  .lbl{font-size:12px;font-weight:500;}
  .lbl-sm{font-size:10.5px;}
  .leader{stroke:var(--ink-3);stroke-width:1;fill:none;}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
  .cell{background:var(--panel);padding:15px 17px;display:flex;flex-direction:column;gap:7px;}
  .cell p{font-size:14.5px;color:var(--ink-2);}
  .cell p b{color:var(--ink);}
  .cell .kv{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);}
  table{border-collapse:collapse;width:100%;min-width:520px;background:var(--panel);}
  th,td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:14.5px;}
  th{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--panel-2);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:0;}
  td.sym{font-weight:500;}
  td.cause{color:var(--ink-2);}
  .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:2px;white-space:nowrap;display:inline-block;}
  .t-prog{color:var(--arc);background:color-mix(in srgb,var(--arc) 13%,transparent);}
  .t-cons{color:var(--heat);background:color-mix(in srgb,var(--heat) 15%,transparent);}
  .t-set{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent);}
  .t-mach{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);}
  .t-safe{color:var(--mech);background:color-mix(in srgb,var(--mech) 18%,transparent);}

  .callout{border-left:3px solid var(--arc);background:var(--panel);padding:14px 18px;display:flex;flex-direction:column;gap:7px;}
  .callout .hd{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--arc);}
  .callout p{font-size:14.8px;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:var(--f-mono);font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:2px;color:var(--ink-2);background:var(--panel);}

  .search-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  input[type="search"]{
    flex:1 1 240px;font-family:var(--f-body);font-size:16px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:9px 12px;
  }
  input[type="search"]:focus{outline:2px solid var(--arc);outline-offset:1px;}
  .filters{display:flex;gap:5px;flex-wrap:wrap;}
  .filters button{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:6px 10px;
    border:1px solid var(--line-soft);background:var(--panel);color:var(--ink-2);
    border-radius:2px;cursor:pointer;
  }
  .filters button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--ink-3);}
  .filters button:focus-visible{outline:2px solid var(--arc);outline-offset:2px;}
  .count{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);}
  tr[hidden]{display:none;}
  tr.gcat td{
    font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--hafnium);background:var(--panel-2);font-weight:600;
    padding-top:14px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  #gtable td{font-size:14.5px;}
  #gtable td.sym{font-weight:500;}

  .qa{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
  details.q{background:var(--panel);}
  details.q summary{
    cursor:pointer;list-style:none;padding:14px 18px;
    font-weight:600;font-size:15px;line-height:1.45;color:var(--ink);
    display:flex;gap:11px;align-items:flex-start;
  }
  details.q summary::-webkit-details-marker{display:none;}
  details.q summary::before{
    content:'+';font-family:var(--f-mono);font-weight:500;font-size:15px;
    color:var(--arc);flex:0 0 auto;line-height:1.45;
  }
  details.q[open] summary::before{content:'\2212';}
  details.q summary:hover{background:var(--panel-2);}
  details.q summary:focus-visible{outline:2px solid var(--arc);outline-offset:-2px;}
  details.q .ans{padding:0 18px 16px 41px;color:var(--ink-2);font-size:14.8px;line-height:1.62;}
  details.q .ans b{color:var(--ink);}
  .qcat{
    font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--arc);font-weight:600;padding-top:8px;
  }
  .qhint{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);}

  pre.code{
    margin:0;background:var(--panel);border:1px solid var(--line-soft);
    border-left:3px solid var(--copper);border-radius:2px;
    padding:14px 16px;overflow-x:auto;
  }
  pre.code code{
    font-family:var(--f-mono);font-size:12.5px;line-height:1.65;
    color:var(--ink-2);white-space:pre;
  }
  pre.code code b{color:var(--ink);font-weight:600;}
  pre.code code i{color:var(--ink-3);font-style:normal;}

  footer{max-width:1080px;margin:0 auto;padding:0 16px 60px;color:var(--ink-3);font-size:12.5px;font-family:var(--f-mono);}
  footer .fr{border-top:1px solid var(--line);padding-top:16px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brandrow">
      <div class="brand">
        <span class="nm" id="brandName"></span>
        <span class="sub" id="brandSub"></span>
      </div>
      <div class="langs" id="langs">
        <button data-l="uk" aria-pressed="true">UKR</button>
        <button data-l="sk" aria-pressed="false">SVK</button>
        <button data-l="en" aria-pressed="false">ENG</button>
      </div>
    </div>
    <nav id="nav" role="tablist"></nav>
  </div>
</div>

<div class="wrap"><div id="view"></div></div>
<footer><div class="fr" id="foot"></div></footer>
